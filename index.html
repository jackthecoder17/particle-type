<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Type anything and thousands of glowing particles form your words. Stir them with the cursor, click to shatter.">
<title>Particle Type</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
  /* Layout: one full-bleed canvas stage, a quiet mark top-left, a floating control dock at the bottom.
     Single-theme by choice: particles glow on deep indigo ink in every viewer theme. */
  :root {
    --ink: #0a0c1c;
    --ink-2: #14172e;
    --line: #2a2f55;
    --paper: #eef0ff;
    --muted: #8a90c0;
    --focus: #ffd166;
    --display: "Unbounded", "Arial Black", system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--ink);
    color: var(--paper);
    font-family: var(--mono);
    overflow: hidden;
    touch-action: none;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; }

  .mark {
    position: fixed; left: 0; top: 0;
    padding: calc(env(safe-area-inset-top, 0px) + 18px) 20px 0;
    display: flex; flex-direction: column; gap: 4px;
    pointer-events: none;
  }
  .mark b { font-family: var(--display); font-size: 15px; letter-spacing: 0.02em; }
  .mark span { font-size: 11px; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }
  .stats {
    position: fixed; right: 0; top: 0;
    padding: calc(env(safe-area-inset-top, 0px) + 18px) 20px 0;
    font-size: 11px; color: var(--muted); letter-spacing: 0.06em;
    font-variant-numeric: tabular-nums; text-align: right; pointer-events: none;
  }

  .dock {
    position: fixed; left: 50%; bottom: 0; transform: translateX(-50%);
    width: min(760px, calc(100% - 32px));
    margin-bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
    padding: 10px;
    background: color-mix(in srgb, var(--ink-2) 82%, transparent);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--line);
    border-radius: 14px;
  }
  .field { flex: 1 1 220px; min-width: 0; position: relative; }
  .field input {
    width: 100%; box-sizing: border-box;
    background: var(--ink); color: var(--paper);
    border: 1px solid var(--line); border-radius: 9px;
    padding: 11px 12px 11px 34px;
    font: 600 14px var(--mono);
    outline: none;
  }
  .field::before {
    content: ">"; position: absolute; left: 13px; top: 50%; transform: translateY(-50%);
    color: var(--focus); font-weight: 600; font-size: 14px;
  }
  .field input:focus-visible { border-color: var(--focus); }
  .swatches { display: flex; gap: 6px; }
  .swatch {
    width: 30px; height: 30px; border-radius: 50%;
    border: 2px solid transparent; cursor: pointer; padding: 0;
    outline-offset: 2px;
  }
  .swatch[aria-pressed="true"] { border-color: var(--paper); }
  .swatch:focus-visible { outline: 2px solid var(--focus); }
  .toggles { display: flex; gap: 6px; }
  .btn {
    background: transparent; color: var(--muted);
    border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 10px; font: 600 11px var(--mono);
    letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer;
  }
  .btn[aria-pressed="true"] { color: var(--ink); background: var(--paper); border-color: var(--paper); }
  .btn:hover { color: var(--paper); }
  .btn[aria-pressed="true"]:hover { color: var(--ink); }
  .btn:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .hint {
    flex-basis: 100%; font-size: 11px; color: var(--muted); letter-spacing: 0.04em;
    padding: 0 4px;
  }
  .hint kbd { color: var(--paper); font-family: var(--mono); }
  @media (max-width: 520px) {
    .hint { display: none; }
    .stats { display: none; }
  }
</style>
</head>
<body>

<canvas id="stage" aria-label="Particle text animation"></canvas>

<div class="mark"><b>Particle Type</b><span>type · hover · click</span></div>
<div class="stats" id="stats"></div>

<form class="dock" id="dock" autocomplete="off">
  <label class="field">
    <input id="text" maxlength="24" placeholder="type anything" aria-label="Text to render in particles">
  </label>
  <div class="swatches" role="group" aria-label="Palette" id="swatches"></div>
  <div class="toggles">
    <button type="button" class="btn" id="trails" aria-pressed="true">Trails</button>
    <button type="button" class="btn" id="auto" aria-pressed="true">Demo</button>
  </div>
  <div class="hint">Move the cursor through the letters. <kbd>Click</kbd> to shatter. <kbd>Space</kbd> outside the box to scatter and reform.</div>
</form>

<script>
(() => {
  const PALETTES = {
    ember:  ["#ff3d7f", "#ff5e3a", "#ff9a3c", "#ffd166", "#fff1c9"],
    aurora: ["#5eead4", "#60a5fa", "#a78bfa", "#f0abfc", "#e0e7ff"],
    tide:   ["#0ea5e9", "#38bdf8", "#2dd4bf", "#a7f3d0", "#f0fdff"],
    candy:  ["#ff6bcb", "#9d7bff", "#6bcbff", "#ffd93d", "#ffffff"],
  };
  const DEMO = ["hello", "build in public", "type anything", "pixels ≠ static", "your name here"];

  const canvas = document.getElementById("stage");
  const ctx = canvas.getContext("2d");
  const input = document.getElementById("text");
  const statsEl = document.getElementById("stats");
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

  let W = 0, H = 0, DPR = 1;
  let particles = [];
  let palette = "ember";
  let trails = true;
  let auto = !reduced;
  let demoIndex = 0, demoTimer = null;
  let currentText = DEMO[0];
  const mouse = { x: -9999, y: -9999, active: false };

  // Particle store as typed arrays for speed
  let N = 0, px, py, vx, vy, tx, ty, ph, col;

  function targetCount() {
    const area = W * H;
    return Math.round(Math.min(9000, Math.max(2500, area / 140)));
  }

  function alloc(n) {
    const old = { px, py, N };
    N = n;
    px = new Float32Array(n); py = new Float32Array(n);
    vx = new Float32Array(n); vy = new Float32Array(n);
    tx = new Float32Array(n); ty = new Float32Array(n);
    ph = new Float32Array(n); col = new Uint8Array(n);
    for (let i = 0; i < n; i++) {
      if (old.N && i < old.N) { px[i] = old.px[i]; py[i] = old.py[i]; }
      else { px[i] = Math.random() * W; py[i] = Math.random() * H; }
      ph[i] = Math.random() * Math.PI * 2;
    }
  }

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue("--ink");
    ctx.fillRect(0, 0, W, H);
    alloc(targetCount());
    setText(currentText);
  }

  // Wrap text into lines that fit the stage, then sample lit pixels as targets.
  function layoutLines(text, off) {
    const maxW = W * 0.88, maxH = H * 0.62;
    const words = text.trim().split(/\s+/);
    let best = null;
    for (let lines = 1; lines <= Math.min(3, words.length); lines++) {
      const per = Math.ceil(words.length / lines);
      const rows = [];
      for (let i = 0; i < words.length; i += per) rows.push(words.slice(i, i + per).join(" "));
      off.font = `800 100px ${getComputedStyle(document.documentElement).getPropertyValue("--display")}`;
      const widest = Math.max(...rows.map(r => off.measureText(r).width));
      const size = Math.min(maxW / widest * 100, maxH / (rows.length * 1.1), H * 0.36);
      if (!best || size > best.size * 1.15) best = { rows, size };
    }
    return best;
  }

  function sampleTargets(text) {
    const off = document.createElement("canvas");
    off.width = W; off.height = H;
    const o = off.getContext("2d", { willReadFrequently: true });
    const { rows, size } = layoutLines(text || " ", o);
    o.fillStyle = "#fff";
    o.textAlign = "center"; o.textBaseline = "middle";
    o.font = `800 ${size}px ${getComputedStyle(document.documentElement).getPropertyValue("--display")}`;
    const lh = size * 1.08;
    const top = H * 0.46 - (rows.length - 1) * lh / 2;
    rows.forEach((r, i) => o.fillText(r, W / 2, top + i * lh));

    const data = o.getImageData(0, 0, W, H).data;
    // Pick a grid step that yields roughly N lit points.
    let lit = 0;
    for (let i = 3; i < data.length; i += 16) if (data[i] > 128) lit++;
    lit *= 4;
    const step = Math.max(1.5, Math.sqrt(lit / N));
    const pts = [];
    for (let y = 0; y < H; y += step) {
      for (let x = 0; x < W; x += step) {
        const jx = x + Math.random() * step, jy = y + Math.random() * step;
        const idx = ((jy | 0) * W + (jx | 0)) * 4 + 3;
        if (data[idx] > 128) pts.push(jx, jy);
      }
    }
    return pts;
  }

  function setText(text) {
    currentText = text;
    const pts = sampleTargets(text);
    const count = pts.length / 2;
    // Shuffle particle order so every morph takes a new route.
    const order = Array.from({ length: N }, (_, i) => i);
    for (let i = N - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [order[i], order[j]] = [order[j], order[i]]; }
    const pal = PALETTES[palette].length;
    for (let k = 0; k < N; k++) {
      const i = order[k];
      if (count === 0) {
        tx[i] = Math.random() * W; ty[i] = Math.random() * H;
      } else {
        const p = (k % count) * 2;
        tx[i] = pts[p] + (k >= count ? (Math.random() - 0.5) * 3 : 0);
        ty[i] = pts[p + 1] + (k >= count ? (Math.random() - 0.5) * 3 : 0);
      }
      // Colour by a diagonal sweep across the word, with a little noise.
      const t = (tx[i] / W) * 0.75 + (ty[i] / H) * 0.25 + (Math.random() - 0.5) * 0.18;
      col[i] = Math.max(0, Math.min(pal - 1, Math.floor(t * pal)));
    }
    statsEl.textContent = `${N.toLocaleString()} particles`;
  }

  function burst(cx, cy, power) {
    for (let i = 0; i < N; i++) {
      const dx = px[i] - cx, dy = py[i] - cy;
      const d = Math.hypot(dx, dy) + 0.01;
      const f = power * Math.max(0.15, 1 - d / Math.max(W, H)) * (0.6 + Math.random() * 0.8);
      vx[i] += dx / d * f; vy[i] += dy / d * f;
    }
  }

  function scatter() {
    for (let i = 0; i < N; i++) {
      vx[i] += (Math.random() - 0.5) * 60;
      vy[i] += (Math.random() - 0.5) * 60;
    }
  }

  const buckets = [];
  let t = 0, last = performance.now(), fps = 60;
  function frame(now) {
    const dt = Math.min(2, (now - last) / 16.67); last = now;
    fps = fps * 0.95 + (60 / dt) * 0.05;
    t += 0.016 * dt;

    const spring = reduced ? 0.02 : 0.045;
    const damp = Math.pow(0.86, dt);
    const R = Math.max(70, Math.min(W, H) * 0.12), R2 = R * R;
    const mx = mouse.x, my = mouse.y;

    ctx.globalCompositeOperation = "source-over";
    ctx.fillStyle = trails ? "rgba(10,12,28,0.26)" : "rgb(10,12,28)";
    ctx.fillRect(0, 0, W, H);

    const pal = PALETTES[palette];
    for (let c = 0; c < pal.length; c++) buckets[c] = [];

    for (let i = 0; i < N; i++) {
      const wob = reduced ? 0 : 0.9;
      const gx = tx[i] + Math.sin(t * 1.3 + ph[i]) * wob;
      const gy = ty[i] + Math.cos(t * 1.1 + ph[i]) * wob;
      vx[i] += (gx - px[i]) * spring * dt;
      vy[i] += (gy - py[i]) * spring * dt;

      const dx = px[i] - mx, dy = py[i] - my, d2 = dx * dx + dy * dy;
      if (d2 < R2) {
        const d = Math.sqrt(d2) + 0.001;
        const f = (1 - d / R) * 6 * dt;
        // Push outward plus a slight swirl so the cursor stirs rather than punches.
        vx[i] += (dx / d) * f - (dy / d) * f * 0.35;
        vy[i] += (dy / d) * f + (dx / d) * f * 0.35;
      }
      vx[i] *= damp; vy[i] *= damp;
      px[i] += vx[i] * dt; py[i] += vy[i] * dt;
      buckets[col[i]].push(i);
    }

    ctx.globalCompositeOperation = "lighter";
    for (let c = 0; c < pal.length; c++) {
      const b = buckets[c];
      ctx.fillStyle = pal[c];
      ctx.globalAlpha = 0.85;
      for (let k = 0; k < b.length; k++) {
        const i = b[k];
        const sp = Math.abs(vx[i]) + Math.abs(vy[i]);
        const s = 1.6 + Math.min(2.2, sp * 0.12);
        ctx.fillRect(px[i] - s / 2, py[i] - s / 2, s, s);
      }
    }
    ctx.globalAlpha = 1;

    if ((now | 0) % 30 < 17) statsEl.textContent = `${N.toLocaleString()} particles · ${Math.round(fps)} fps`;
    requestAnimationFrame(frame);
  }

  // Demo cycle
  function scheduleDemo() {
    clearInterval(demoTimer);
    if (!auto) return;
    demoTimer = setInterval(() => {
      demoIndex = (demoIndex + 1) % DEMO.length;
      setText(DEMO[demoIndex]);
    }, 3600);
  }
  function setAuto(on) {
    auto = on;
    document.getElementById("auto").setAttribute("aria-pressed", String(on));
    scheduleDemo();
  }

  // Controls
  const sw = document.getElementById("swatches");
  Object.entries(PALETTES).forEach(([name, cols]) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "swatch"; b.id = "pal-" + name;
    b.setAttribute("aria-label", name + " palette");
    b.setAttribute("aria-pressed", String(name === palette));
    b.style.background = `conic-gradient(${cols.slice(0, 4).join(",")},${cols[0]})`;
    b.addEventListener("click", () => {
      palette = name;
      sw.querySelectorAll(".swatch").forEach(s => s.setAttribute("aria-pressed", String(s === b)));
      setText(currentText);
    });
    sw.appendChild(b);
  });

  document.getElementById("trails").addEventListener("click", e => {
    trails = !trails; e.currentTarget.setAttribute("aria-pressed", String(trails));
  });
  document.getElementById("auto").addEventListener("click", () => setAuto(!auto));

  let typeTimer;
  input.addEventListener("input", () => {
    setAuto(false);
    clearTimeout(typeTimer);
    typeTimer = setTimeout(() => setText(input.value.trim() || " "), 220);
  });
  document.getElementById("dock").addEventListener("submit", e => {
    e.preventDefault();
    setAuto(false);
    setText(input.value.trim() || " ");
    burst(W / 2, H * 0.46, 18);
  });

  canvas.addEventListener("pointermove", e => { mouse.x = e.clientX; mouse.y = e.clientY; });
  canvas.addEventListener("pointerleave", () => { mouse.x = mouse.y = -9999; });
  canvas.addEventListener("pointerdown", e => {
    mouse.x = e.clientX; mouse.y = e.clientY;
    burst(e.clientX, e.clientY, 34);
  });
  canvas.addEventListener("pointerup", e => {
    if (e.pointerType !== "mouse") mouse.x = mouse.y = -9999;
  });
  window.addEventListener("keydown", e => {
    if (e.target === input) return;
    if (e.code === "Space") { e.preventDefault(); scatter(); }
  });

  let resizeTimer;
  window.addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(resize, 150); });

  const fontReady = document.fonts && document.fonts.load
    ? Promise.race([document.fonts.load('800 100px "Unbounded"'), new Promise(r => setTimeout(r, 1500))])
    : Promise.resolve();
  fontReady.then(() => {
    resize();
    requestAnimationFrame(frame);
    scheduleDemo();
  });
})();
</script>
</body>
</html>
